<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page Not Found — VM Brothers Cricket Ground</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#15132B" />
<link rel="icon" type="image/png" href="assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .nf {
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 2rem 1.25rem;
    position: relative;
    isolation: isolate;
    overflow: hidden;
  }
  .nf__bg {
    position: absolute; inset: 0; z-index: -1;
    background:
      radial-gradient(70% 90% at 50% 110%, rgba(62,155,107,.22), transparent 60%),
      radial-gradient(60% 80% at 50% -10%, rgba(255,193,77,.2), transparent 62%),
      linear-gradient(160deg, var(--navy-850), var(--navy-950));
  }
  .nf__inner { max-width: 560px; }
  .nf__logo {
    width: 78px; height: 78px; margin: 0 auto 1.75rem;
    border-radius: 21px; box-shadow: 0 10px 30px rgba(8,7,18,.5);
  }
  .nf__code {
    font-family: var(--font-display);
    font-size: clamp(3.5rem, 2rem + 9vw, 6rem);
    font-weight: 800; line-height: 1; letter-spacing: -.04em;
    margin: 0 0 .5rem;
  }
  .nf__title { font-size: clamp(1.4rem, 1.1rem + 1.4vw, 1.9rem); color: #FFF; margin-bottom: .7rem; }
  .nf__text { color: var(--ink-on-dark-muted); margin-bottom: 2rem; }
  .nf__actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem; }
  @media (max-width: 480px) { .nf__actions .btn { width: 100%; } }
</style>
</head>
<body>
  <section class="nf">
    <div class="nf__bg" aria-hidden="true"></div>
    <div class="nf__inner">
      <img class="nf__logo" src="assets/img/logo.png" alt="VM Brothers Cricket Ground" width="78" height="78" />
      <p class="nf__code grad-text">404</p>
      <h1 class="nf__title">That ball went over the boundary</h1>
      <p class="nf__text">
        The page you were looking for isn't here. Head back to the home page, or just give us a call
        and we'll sort it out.
      </p>
      <div class="nf__actions">
        <a class="btn btn--primary btn--lg" href="./">
          <span>Back to Home</span>
        </a>
        <a class="btn btn--ghost btn--lg" href="tel:+919824942790">

          <span>Call Us</span>
        </a>
      </div>
    </div>
  </section>
</body>
</html>
